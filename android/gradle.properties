org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Only android-36 is installed on this machine; silence the "untested compileSdk"
# warning that AGP 8.9 emits for it.
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official

# The repo lives under a directory containing U+2800; AGP blocks non-ASCII
# paths by default. See android/README.md for the caveat.
android.overridePathCheck=true

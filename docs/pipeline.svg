<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>The AnkiGen pipeline: eight idempotent stages over a DuckDB warehouse</title>
  <style>
    .bg    { fill: #ffffff; }
    .card  { fill: #f8fafc; stroke: #cbd5e1; }
    .name  { fill: #0f172a; font-size: 15px; font-weight: 600; }
    .sub   { fill: #64748b; font-size: 11px; }
    .title { fill: #0f172a; font-size: 21px; font-weight: 600; }
    .lede  { fill: #64748b; font-size: 13px; }
    .wh    { fill: #eff6ff; stroke: #93c5fd; }
    .whtxt { fill: #1e40af; }
    .out   { fill: #ecfdf5; stroke: #6ee7b7; }
    .outtxt{ fill: #065f46; }
    .ext   { fill: none; stroke: #cbd5e1; stroke-dasharray: 4 3; }
    .exttxt{ fill: #64748b; font-size: 11px; }
    .flow  { stroke: #94a3b8; fill: none; stroke-width: 1.6; }
    .tick  { stroke: #cbd5e1; stroke-width: 1.2; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; }
      .card  { fill: #161b22; stroke: #30363d; }
      .name  { fill: #e6edf3; }
      .sub   { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .lede  { fill: #8b949e; }
      .wh    { fill: #0b2545; stroke: #1f6feb; }
      .whtxt { fill: #79c0ff; }
      .out   { fill: #0d2b22; stroke: #238636; }
      .outtxt{ fill: #7ee2b8; }
      .ext   { stroke: #30363d; }
      .exttxt{ fill: #8b949e; }
      .flow  { stroke: #6e7681; }
      .tick  { stroke: #30363d; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="bg" width="1180" height="560"/>

  <text class="title" x="46" y="44">AnkiGen — a daily card pipeline</text>
  <text class="lede"  x="46" y="68">Eight stages, each idempotent and keyed by run_date. They talk to each other only through the warehouse, so any stage can be re-run or backfilled on its own.</text>

  <!-- input -->
  <rect class="card" x="46" y="104" width="262" height="46" rx="7"/>
  <text class="name" x="62" y="126">Anki collection</text>
  <text class="sub"  x="62" y="142">read through a snapshot — never modified</text>
  <path class="flow" d="M108 150 L108 246" marker-end="url(#a)"/>

  <!-- external services -->
  <rect class="ext" x="320" y="178" width="262" height="34" rx="7"/>
  <text class="exttxt" x="451" y="199" text-anchor="middle">LLM provider — one model writes, a second one checks</text>
  <path class="tick" d="M382 212 L382 246"/>
  <path class="tick" d="M519 212 L519 246"/>

  <rect class="ext" x="594" y="178" width="125" height="34" rx="7"/>
  <text class="exttxt" x="656" y="199" text-anchor="middle">embeddings</text>
  <path class="tick" d="M656 212 L656 246"/>

  <rect class="ext" x="731" y="178" width="125" height="34" rx="7"/>
  <text class="exttxt" x="793" y="199" text-anchor="middle">image search</text>
  <path class="tick" d="M793 212 L793 246"/>

  <!-- stages -->
  <g>
    <rect class="card" x="46"   y="246" width="125" height="62" rx="7"/>
    <text class="name" x="108"  y="274" text-anchor="middle">ingest</text>
    <text class="sub"  x="108"  y="292" text-anchor="middle">snapshot + load</text>

    <rect class="card" x="183"  y="246" width="125" height="62" rx="7"/>
    <text class="name" x="245"  y="274" text-anchor="middle">target</text>
    <text class="sub"  x="245"  y="292" text-anchor="middle">what to write</text>

    <rect class="card" x="320"  y="246" width="125" height="62" rx="7"/>
    <text class="name" x="382"  y="274" text-anchor="middle">generate</text>
    <text class="sub"  x="382"  y="292" text-anchor="middle">cards in your voice</text>

    <rect class="card" x="457"  y="246" width="125" height="62" rx="7"/>
    <text class="name" x="519"  y="274" text-anchor="middle">verify</text>
    <text class="sub"  x="519"  y="292" text-anchor="middle">fact-check</text>

    <rect class="card" x="594"  y="246" width="125" height="62" rx="7"/>
    <text class="name" x="656"  y="274" text-anchor="middle">dedup</text>
    <text class="sub"  x="656"  y="292" text-anchor="middle">whole collection</text>

    <rect class="card" x="731"  y="246" width="125" height="62" rx="7"/>
    <text class="name" x="793"  y="274" text-anchor="middle">images</text>
    <text class="sub"  x="793"  y="292" text-anchor="middle">when one helps</text>

    <rect class="card" x="868"  y="246" width="125" height="62" rx="7"/>
    <text class="name" x="930"  y="274" text-anchor="middle">export</text>
    <text class="sub"  x="930"  y="292" text-anchor="middle">.apkg + media</text>

    <rect class="card" x="1005" y="246" width="125" height="62" rx="7"/>
    <text class="name" x="1067" y="274" text-anchor="middle">report</text>
    <text class="sub"  x="1067" y="292" text-anchor="middle">what happened</text>
  </g>

  <!-- flow between stages -->
  <g class="flow" marker-end="url(#a)">
    <path d="M171 277 L181 277"/>
    <path d="M308 277 L318 277"/>
    <path d="M445 277 L455 277"/>
    <path d="M582 277 L592 277"/>
    <path d="M719 277 L729 277"/>
    <path d="M856 277 L866 277"/>
    <path d="M993 277 L1003 277"/>
  </g>

  <!-- warehouse -->
  <path class="tick" d="M108 308 L108 356 M245 308 L245 356 M382 308 L382 356 M519 308 L519 356
                        M656 308 L656 356 M793 308 L793 356 M930 308 L930 356 M1067 308 L1067 356"/>
  <rect class="wh" x="46" y="356" width="1084" height="72" rx="8"/>
  <text class="name whtxt" x="588" y="384" text-anchor="middle">DuckDB warehouse — one partition per run_date</text>
  <text class="sub whtxt"  x="588" y="406" text-anchor="middle">raw_notes · raw_revlog · requests · generated_cards · verified_cards · dedup_results · card_images · embedding_cache</text>
  <text class="sub whtxt"  x="588" y="420" text-anchor="middle">re-running a date replaces its partition, which is what makes retries and backfills safe</text>

  <!-- outputs -->
  <path class="flow" d="M930 428 L930 466" marker-end="url(#a)"/>
  <rect class="out" x="731" y="466" width="399" height="58" rx="7"/>
  <text class="name outtxt" x="930" y="490" text-anchor="middle">data/out/&lt;date&gt;/</text>
  <text class="sub outtxt"  x="930" y="508" text-anchor="middle">ankigen_&lt;date&gt;.apkg · run_report.json · curated Parquet</text>

  <rect class="ext" x="46" y="466" width="399" height="58" rx="7"/>
  <text class="exttxt" x="62" y="488">Runs daily on GitHub Actions, or locally, or as an Airflow DAG —</text>
  <text class="exttxt" x="62" y="506">one task per stage, nothing passed between them but the warehouse.</text>
</svg>

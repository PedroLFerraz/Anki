[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ankigen"
version = "2.0.0"
description = "Daily batch pipeline that generates new Anki cards from your existing collection and a personal prompt profile."
requires-python = ">=3.10"
dependencies = [
    "ddgs>=9.0",
    "duckdb>=1.0",
    "genanki>=0.13",
    # Every downloaded illustration is re-encoded as JPEG: Anki's importer
    # silently dropped some of the PNGs and WebPs image search returns.
    "pillow>=10.0",
    "numpy>=1.24",
    "openai>=1.40",
    "pyarrow>=14",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "typer>=0.12",
]

[project.optional-dependencies]
gemini = ["google-genai>=0.3"]
dev = ["pytest>=8"]

[project.scripts]
ankigen = "ankigen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ankigen = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# An editable install cannot be built from a path containing U+2800, so tests
# import the package straight from src/.
pythonpath = ["src"]

# The daily run, on GitHub's machines rather than yours.
#
# Each run gets a clean Linux VM that is destroyed afterwards, so everything
# the pipeline needs is either fetched here or cached:
#
#   code        cloned from this repo
#   collection  synced down from AnkiWeb, since the runner cannot see your
#               machine. The cards go back the same way, so nothing is
#               downloaded and imported by hand
#   embeddings  computed in-process by fastembed; there is no Ollama here
#   warehouse   restored from the Actions cache, saved again at the end
#   the cards   synced back to AnkiWeb, and also kept as an artifact
#
# Free on public repositories. Note that GitHub disables scheduled workflows
# after 60 days without a commit, so a dormant repo stops running silently.
name: daily cards

on:
  # GitHub's scheduler is best-effort: at the top of the hour it is at its
  # busiest and drops runs outright, which is how the first 09:00 run never
  # happened. So an odd minute, and a second chance later that stands down if
  # the first one worked (see `gate`).
  schedule:
    - cron: "17 8 * * *"     # 08:17 UTC = 05:17 America/Sao_Paulo
    - cron: "43 11 * * *"    # the backup, 08:43 local
  workflow_dispatch:
    inputs:
      deck:
        description: "One deck to write for. Blank runs today's whole plan."
        required: false
        type: string
      topic:
        description: "What to write about (needs a deck)."
        required: false
        type: string
      prompt:
        description: "Extra steer on top of the profile (needs a deck)."
        required: false
        type: string
      count:
        description: "How many cards (needs a deck). Blank uses the deck's quota."
        required: false
        type: string
      run_date:
        description: "Date to generate for (YYYY-MM-DD). Blank means today."
        required: false
        type: string
      stages:
        description: "Only these stages, comma-separated (e.g. images,export,report). Blank runs all."
        required: false
        type: string

concurrency:                  # DuckDB takes one writer, and so does the cache
  group: daily-cards
  cancel-in-progress: false

jobs:
  # Only the backup schedule is ever turned away: a manual run always goes
  # ahead, and so does the first scheduled one. Only scheduled successes count,
  # since a manual run for one deck is not the day's plan.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=true
          if [ "${{ github.event_name }}" = schedule ]; then
            today=$(date -u +%F)
            done=$(gh api "repos/${{ github.repository }}/actions/workflows/daily-cards.yml/runs?event=schedule&status=success&created=>=$today" --jq .total_count)
            if [ "$done" -gt 0 ]; then
              echo "A scheduled run already succeeded today; standing down."
              go=false
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  generate:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Check the setup is complete
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANKIWEB_KEY: ${{ secrets.ANKIWEB_KEY }}
        run: |
          missing=""
          [ -z "$GOOGLE_API_KEY" ] && missing="$missing GOOGLE_API_KEY"
          [ -z "$ANKIWEB_KEY" ] && missing="$missing ANKIWEB_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "ANKIWEB_KEY comes from 'ankigen push --login'. See docs/GITHUB_ACTIONS.md."
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Draws the diagrams the model describes for a card (visuals.py). Without
      # it those cards fall back to searching the web for a picture.
      - run: sudo apt-get install -y --no-install-recommends graphviz

      # [gemini] pulls google-genai, which is an extra because it is the one
      # provider that does not speak the OpenAI protocol. Without it the run
      # gets all the way to the first request before failing.
      - run: pip install ".[gemini,push]"

      # The warehouse holds every past run: what was generated, what was kept,
      # and the embedding cache. Losing it is survivable — the next run rebuilds
      # from the collection — but it would forget which cards it already made.
      - name: Restore the warehouse
        uses: actions/cache/restore@v6
        id: warehouse
        with:
          path: data/warehouse.duckdb
          key: warehouse-${{ github.run_id }}
          restore-keys: warehouse-

      - name: Restore the collection
        uses: actions/cache/restore@v6
        id: collection
        with:
          path: data/anki
          key: anki-collection-${{ github.run_id }}
          restore-keys: anki-collection-

      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - name: Run the pipeline
        env:
          ANKI_COLLECTION_PATH: data/anki/collection.anki2
          ANKIWEB_KEY: ${{ secrets.ANKIWEB_KEY }}
          ANKIGEN_PROFILE: profiles/default.yaml
          DATA_DIR: data
          EMBEDDING_PROVIDER: fastembed
          LLM_PROVIDER: gemini
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          # Best first. Free tiers meter per model, so every model in the chain
          # is another day's allowance; the last two are there for days when
          # the flash models are all busy or spent, which happened by 11:00
          # UTC on the first day of manual runs.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3-flash-preview,gemma-4-31b-it' }}
          # A checker that is not the writer catches more, and free tiers
          # meter per model, so this also doubles the daily allowance. Its
          # Gemma is not the writer's Gemma, for the same reason.
          VERIFY_MODEL: ${{ vars.VERIFY_MODEL || 'gemini-3.5-flash-lite,gemini-flash-lite-latest,gemini-3.1-flash-lite,gemma-4-26b-a4b-it' }}
        run: |
          # Built up rather than branched: the inputs are independent, and the
          # CLI already rejects a topic or prompt with no deck.
          when=()
          [ -n "${{ inputs.run_date }}" ] && when+=(--date "${{ inputs.run_date }}")
          args=("${when[@]}")
          [ -n "${{ inputs.deck }}" ]   && args+=(--deck "${{ inputs.deck }}")
          [ -n "${{ inputs.topic }}" ]  && args+=(--topic "${{ inputs.topic }}")
          [ -n "${{ inputs.prompt }}" ] && args+=(--prompt "${{ inputs.prompt }}")
          [ -n "${{ inputs.count }}" ]  && args+=(--count "${{ inputs.count }}")
          # Re-running only the later stages redoes a day's pictures without
          # writing new cards, and the push then refreshes them on the notes.
          for stage in $(echo "${{ inputs.stages }}" | tr ',' ' '); do
            args+=(--stage "$stage")
          done

          python -m ankigen pull
          echo "ankigen run ${args[*]}"
          python -m ankigen run "${args[@]}"
          # push syncs down again first, so anything reviewed while the run was
          # working is merged before the new cards go up.
          python -m ankigen push "${when[@]}"

      # Only on success: a failed run's working copy may be empty or
      # half-synced, and caching that poisons every run after it.
      - name: Save the collection
        if: success()
        uses: actions/cache/save@v6
        with:
          path: data/anki
          key: anki-collection-${{ github.run_id }}

      - name: Save the warehouse
        if: always()            # a failed generate still advanced ingest
        uses: actions/cache/save@v6
        with:
          path: data/warehouse.duckdb
          key: warehouse-${{ github.run_id }}

      - name: Upload the cards
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cards-${{ inputs.run_date || 'today' }}
          path: |
            data/out/**/*.apkg
            data/out/**/run_report.json
          if-no-files-found: warn
          retention-days: 90
